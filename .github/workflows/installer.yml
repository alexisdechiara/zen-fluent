name: Installer

# Builds installer/ZenFluentSetup.ps1 into ZenFluentSetup.exe (ps2exe, a
# window application without a console), which installs the mods from the
# branch or tag it was built from (the script's -Ref default). Every run
# keeps it as an artifact. A release tag (vX.Y.Z) attaches it to the GitHub
# release (created when the tag has none yet); a branch push publishes it
# as the pre-release "installer-<branch>", replaced at each push, for a
# stable download link while testing.

on:
  # Branch pushes that touch the installer; every release tag (GitHub
  # does not apply path filters to tags)
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - installer/**
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - installer/**
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # The branch (or tag) the installer installs Zen Fluent from
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the script parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\installer\ZenFluentSetup.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Build ZenFluentSetup.exe
        shell: powershell
        run: |
          # The default -Ref becomes the branch or tag being built
          $script = Get-Content installer\ZenFluentSetup.ps1 -Raw -Encoding UTF8
          $script = $script.Replace('[string]$Ref = "main"', "[string]`$Ref = `"$env:SOURCE_REF`"")
          New-Item -ItemType Directory -Force build | Out-Null
          [IO.File]::WriteAllText("$PWD\build\ZenFluentSetup.ps1", $script, (New-Object Text.UTF8Encoding $true))
          Install-Module ps2exe -Scope CurrentUser -Force
          $version = (Get-Content theme.json -Raw | ConvertFrom-Json).version
          Invoke-ps2exe -inputFile build\ZenFluentSetup.ps1 -outputFile ZenFluentSetup.exe `
            -noConsole -title "Zen Fluent setup" -product "Zen Fluent" `
            -description "Installs Sine, Zen Fluent and Zen Fluent Enhanced ($env:SOURCE_REF)" `
            -copyright "MIT, alexisdechiara" -version "$version.0"
      - uses: actions/upload-artifact@v4
        with:
          name: ZenFluentSetup
          path: |
            ZenFluentSetup.exe
            build/ZenFluentSetup.ps1
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ZenFluentSetup.exe build/ZenFluentSetup.ps1 --clobber
      - name: Publish the branch pre-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="installer-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release create "$tag" ZenFluentSetup.exe build/ZenFluentSetup.ps1 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Installer: $GITHUB_REF_NAME" \
            --notes "Test build of the Windows installer from the \`$GITHUB_REF_NAME\` branch (commit ${GITHUB_SHA:0:7}). It installs Zen Fluent and Zen Fluent Enhanced from that branch. Replaced at each push that touches the installer; not a release."
