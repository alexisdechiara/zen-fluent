<!doctype html>
<!-- Zen Fluent Enhanced: the Zen Fluent pane of Zen's settings.
     Served as about:zen-fluent by scripts/lib/zf-settings.sys.mjs in the
     parent process, with the system principal, and shown in an iframe of
     about:preferences (about:preferences#zenFluent), whose navigation lists
     its sections. Its relative URLs point to this folder through <base>. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="chrome://sine/content/Zen-Fluent-Enhanced/settings/" />
    <meta name="color-scheme" content="light dark" />
    <title>Zen Fluent settings</title>
    <link rel="icon" href="icons/sparkle.svg" />
    <link rel="stylesheet" href="settings.css" />
    <script type="module" src="settings.mjs"></script>
  </head>
  <body>
    <main class="main" id="main" tabindex="-1"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
